name: Publicar APK firmado
on:
  push:
    branches: [version-kotlin-compose]
    paths:
      - 'version-compose/release-transfer.json'
      - '.github/workflows/publish-prepared.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Recuperar APK firmado y comprobar su procedencia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, base64, hashlib, re, os
          repo = os.environ['GITHUB_REPOSITORY']
          meta = json.loads(Path('version-compose/release-transfer.json').read_text())
          assert re.fullmatch(r'[0-9a-f]{40}', meta['source_commit'])
          assert meta['filename'] == 'PDF-Facil-Pro-2.3-beta.apk'
          run = json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/runs/{meta['verification_run']}"], text=True))
          assert run['conclusion'] == 'success' and run['head_sha'] == meta['source_commit']
          diff = json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/compare/{meta['source_commit']}...{os.environ['GITHUB_SHA']}"], text=True))
          assert not any(f['filename'].startswith('version-compose/app/') for f in diff.get('files',[])), 'La APK no corresponde al código actual de la app'
          folder=Path('publicacion');folder.mkdir()
          target=folder/meta['filename']
          with target.open('wb') as out:
              for sha in meta['chunks']:
                  assert re.fullmatch(r'[0-9a-f]{40}',sha)
                  content=subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{sha}','--jq','.content'])
                  out.write(base64.b64decode(content))
          actual=hashlib.sha256(target.read_bytes()).hexdigest()
          assert actual == meta['sha256'], 'La APK transferida no supera SHA-256'
          (folder/'SHA256.txt').write_text(actual+'  '+target.name+'\n')
          print('APK firmado recuperado y verificado:',target.name)
          PY
      - name: Verificar certificado permanente y versión
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs publicacion/PDF-Facil-Pro-2.3-beta.apk > publicacion/FIRMA.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging publicacion/PDF-Facil-Pro-2.3-beta.apk > publicacion/METADATOS.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          signature=Path('publicacion/FIRMA.txt').read_text()
          expected=Path('version-compose/signing-certificate.sha256').read_text().strip()
          actual=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',signature).group(1)
          assert actual==expected, 'El certificado no es el permanente'
          info=Path('publicacion/METADATOS.txt').read_text()
          assert "name='com.pdffacil.pro'" in info and "versionCode='6'" in info and "versionName='2.3-beta'" in info
          assert 'application-debuggable' not in info
          PY
      - name: Publicar descarga instalable en GitHub Releases
        run: |
          cp version-compose/README.md publicacion/INSTRUCCIONES.md
          cat > notas.md <<'NOTAS'
          PDF Fácil Pro 2.3 beta: edición de texto original, selección y movimiento de imágenes, oferta del visor tras instalar/actualizar y firma permanente.

          Descarga PDF-Facil-Pro-2.3-beta.apk. Es la APK instalable firmada, compilada en GitHub y verificada con el certificado permanente.

          Se comprobaron siete pruebas de texto e imágenes y un Android emulado: primer inicio, rechazo sin repetición, configuración manual, actualización con la misma firma conservando borrador, oferta tras actualizar, apertura externa y arrastre de imagen.

          Migración: las versiones anteriores usaban otras claves temporales. Exporta los borradores antes de retirar una versión antigua incompatible. Las siguientes entregas deben mantener esta nueva firma para poder actualizar sin desinstalar.

          Android exige confirmar el visor predeterminado y el gestor de archivos decide los iconos/miniaturas. Para mover una imagen: Editar → Imagen; selecciona y arrastra su marco. Los elementos dentro de grupos complejos pueden no seleccionarse individualmente.
          NOTAS
          if ! gh release view v2.3-beta --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create v2.3-beta --repo "$GITHUB_REPOSITORY" --target 2181f9510c1b233d034f0b1524654bf2b4c02221 --draft --prerelease --title 'PDF Fácil Pro 2.3 beta' --notes-file notas.md
          fi
          gh release upload v2.3-beta publicacion/PDF-Facil-Pro-2.3-beta.apk publicacion/SHA256.txt publicacion/FIRMA.txt publicacion/INSTRUCCIONES.md --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v2.3-beta --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes-file notas.md
