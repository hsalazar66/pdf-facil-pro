name: Compilar PDF Facil Pro
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Comprobar archivo APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Facil-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
