name: Compilar PDF Facil Pro Compose
on:
  workflow_dispatch:
  push:
    branches: [main, version-kotlin-compose]
    paths: ['version-compose/**', '.github/workflows/compose.yml']
  pull_request:
    paths: ['version-compose/**', '.github/workflows/compose.yml']
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: version-compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compilar y probar texto e imágenes
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Habilitar aceleración del emulador
        if: github.event_name != 'pull_request'
        run: sudo chmod 666 /dev/kvm
      - name: Probar primer inicio, actualización e imágenes en Android
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          working-directory: version-compose
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android_smoke.py
      - name: Publicar capturas y prueba Android
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Verificacion-Android-2.4
          path: version-compose/verification-android/
          if-no-files-found: ignore
      - name: Verificar el PDF exportado en Android
        if: github.event_name != 'pull_request'
        env:
          PDF_SMOKE_EXPORT: ${{ github.workspace }}/version-compose/verification-android/resultado-editado.pdf
        run: gradle :app:testDebugUnitTest --tests com.pdffacil.pro.ExportVerificationTest --no-daemon
      - name: Preparar firma permanente
        id: firma
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pdf-facil-pro-permanente.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'].strip(), validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('ANDROID_SIGNING_KEYSTORE_PATH=' + str(key) + '\n')
          PY
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Faltan los secretos de firma permanente. No se publicará ninguna APK.'
            exit 1
          fi
      - name: Compilar release
        if: steps.firma.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verificar y preparar APK actualizable
        if: steps.firma.outputs.available == 'true'
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/release/app-release.apk entrega/PDF-Facil-Pro-2.4-beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs entrega/PDF-Facil-Pro-2.4-beta.apk > entrega/FIRMA.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          expected = Path('signing-certificate.sha256').read_text().strip().lower()
          report = Path('entrega/FIRMA.txt').read_text()
          match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', report)
          assert match and match.group(1).lower() == expected, 'La firma no corresponde a la clave permanente de esta app'
          PY
          cp README.md entrega/INSTRUCCIONES.md
      - name: Probar actualización real desde release 2.3
        if: steps.firma.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          working-directory: version-compose
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android_update_release.py
      - name: Publicar prueba de actualización firmada
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Verificacion-Actualizacion-2.3-a-2.4
          path: |
            version-compose/verification-update/*.png
            version-compose/verification-update/*.txt
            version-compose/verification-update/*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: steps.firma.outputs.available == 'true'
        with:
          name: PDF-Facil-Pro-2.4-Actualizable-APK
          path: version-compose/entrega/*
          if-no-files-found: error
          retention-days: 30
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pruebas-texto-imagenes
          path: |
            version-compose/app/build/reports/tests/testDebugUnitTest/
            version-compose/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Retirar clave temporal del ejecutor
        if: always() && steps.firma.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pdf-facil-pro-permanente.jks'
          key.unlink(missing_ok=True)
          PY
  publicar:
    needs: compilar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF-Facil-Pro-2.4-Actualizable-APK
          path: entrega
      - name: Publicar APK firmada y probada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > notas.md <<'NOTAS'
          PDF Fácil Pro 2.4 beta: compartir PDF por WhatsApp, Google Drive, correo y otras aplicaciones; guardar en el celular; recortar, ampliar, reducir y girar imágenes; añadir hojas nuevas; copiar, cortar y pegar texto e imágenes.

          APK compilada y firmada en GitHub. Certificado permanente verificado. Probada la actualización desde 2.3 sin desinstalar, conservando borradores. Android pide confirmación para instalar y elegir visor predeterminado. El gestor de archivos decide los iconos y miniaturas.

          Texto editable por fragmentos; sin OCR ni redistribución de párrafos. Selección de imágenes independientes compatibles. Revisa el resultado antes de compartir.
          NOTAS
          if gh release view v2.4-beta >/dev/null 2>&1; then
            gh release upload v2.4-beta entrega/* --clobber
            gh release edit v2.4-beta --title 'PDF Fácil Pro 2.4 beta' --notes-file notas.md --prerelease
          else
            gh release create v2.4-beta entrega/* --target "$RELEASE_COMMIT" --title 'PDF Fácil Pro 2.4 beta' --notes-file notas.md --prerelease
          fi
