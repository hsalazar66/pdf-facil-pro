name: Compilar PDF Facil Pro Compose
on:
  workflow_dispatch:
  push:
    branches: [main, version-kotlin-compose]
    paths: ['version-compose/**', '.github/workflows/compose.yml']
  pull_request:
    paths: ['version-compose/**', '.github/workflows/compose.yml']
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: version-compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar y analizar
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Preparar entrega 2.2
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk entrega/PDF-Facil-Pro-2.2-beta.apk
          cp README.md entrega/INSTRUCCIONES.md
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Facil-Pro-2.2-Visor-APK
          path: version-compose/entrega/*
          if-no-files-found: error
          retention-days: 30
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pruebas-editor-real
          path: |
            version-compose/app/build/reports/tests/testDebugUnitTest/
            version-compose/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
