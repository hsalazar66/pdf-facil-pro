name: Compilar PDF Facil Pro Compose
on:
  workflow_dispatch:
  push:
    branches: [main, version-kotlin-compose]
    paths: ['version-compose/**', '.github/workflows/compose.yml']
  pull_request:
    paths: ['version-compose/**', '.github/workflows/compose.yml']
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: version-compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compilar y probar texto e imágenes
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Habilitar aceleración del emulador
        if: github.event_name != 'pull_request'
        run: sudo chmod 666 /dev/kvm
      - name: Probar primer inicio, actualización e imágenes en Android
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          working-directory: version-compose
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/android_smoke.py
            python3 scripts/android_tables.py
      - name: Publicar capturas y prueba Android
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Verificacion-Android-2.6
          path: version-compose/verification-android/
          if-no-files-found: ignore
      - name: Verificar el PDF exportado en Android
        if: github.event_name != 'pull_request'
        env:
          PDF_SMOKE_EXPORT: ${{ github.workspace }}/version-compose/verification-android/resultado-editado.pdf
        run: gradle :app:testDebugUnitTest --tests com.pdffacil.pro.ExportVerificationTest --no-daemon
      - name: Preparar APK instalable de prueba
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk entrega/PDF-Facil-Pro-2.6-beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs entrega/PDF-Facil-Pro-2.6-beta.apk > entrega/FIRMA.txt
          sha256sum entrega/PDF-Facil-Pro-2.6-beta.apk > entrega/SHA256.txt
          cp README.md entrega/INSTRUCCIONES.md
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: PDF-Facil-Pro-2.6-Prueba-APK
          path: version-compose/entrega/*
          if-no-files-found: error
          retention-days: 30
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pruebas-texto-imagenes
          path: |
            version-compose/app/build/reports/tests/testDebugUnitTest/
            version-compose/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
  publicar:
    needs: compilar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF-Facil-Pro-2.6-Prueba-APK
          path: entrega
      - name: Publicar APK firmada y probada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > notas.md <<'NOTAS'
          PDF Fácil Pro 2.6 beta: tablas editables como objetos completos. Mover y cambiar ancho con el dedo, editar texto y números en cualquier celda, insertar imágenes con proporciones conservadas y ajustar filas/columnas al contenido. Recupera tablas creadas con 2.5. Conserva selección, Word/PDF editable, OCR, imágenes y compartir.

          APK de prueba compilada en GitHub, con firma de depuración y sin secretos externos. ESTA FIRMA ES DISTINTA DE LA VERSIONES ANTERIORES: guarda tus documentos fuera de la app, desinstala la anterior e instala esta APK. No se garantiza actualización con próximas compilaciones de prueba. Android pide confirmación para instalar y elegir visor predeterminado. El gestor de archivos decide los iconos y miniaturas.

          Word y PDF editable de texto reconstruidos: no conservan imágenes ni garantizan la distribución original. OCR local en páginas sin texto: revisar el resultado. Texto original editable por fragmentos. Selección de imágenes independientes compatibles. Revisa el resultado antes de compartir.
          NOTAS
          if gh release view v2.6-beta >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v2.6-beta" -f sha="$RELEASE_COMMIT" -F force=true >/dev/null
            gh release upload v2.6-beta entrega/* --clobber
            gh release edit v2.6-beta --title 'PDF Fácil Pro 2.6 beta · APK de prueba' --notes-file notas.md --prerelease
          else
            gh release create v2.6-beta entrega/* --target "$RELEASE_COMMIT" --title 'PDF Fácil Pro 2.6 beta · APK de prueba' --notes-file notas.md --prerelease
          fi
